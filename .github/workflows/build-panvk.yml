name: Build PanVK Driver (ARM64)

on:
  workflow_dispatch:   # 手动触发，点击 Actions 页面里的 "Run workflow" 按钮即可

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 你的仓库里已经有 Mesa 源码，所以不需要 checkout 外部仓库
      #    直接使用当前工作目录中的源码

      # 2. 安装编译依赖（包括交叉编译工具链）
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build python3-pip python3-setuptools \
            pkg-config \
            libwayland-dev libx11-dev libxext-dev \
            libxdamage-dev libxfixes-dev libxcb-glx0-dev \
            libxcb-shm0-dev libxxf86vm-dev libdrm-dev \
            git build-essential bison flex libglvnd-dev \
            crossbuild-essential-arm64

      # 3. 创建交叉编译配置文件（针对 aarch64）
      - name: Create cross file
        run: |
          cat > cross_file_arm64.txt << 'EOF'
          [binaries]
          c = '/usr/bin/aarch64-linux-gnu-gcc'
          cpp = '/usr/bin/aarch64-linux-gnu-g++'
          ar = '/usr/bin/aarch64-linux-gnu-ar'
          strip = '/usr/bin/aarch64-linux-gnu-strip'
          pkgconfig = '/usr/bin/pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      # 4. 配置 Meson（指定源码目录为当前目录 `.`，构建目录为 `build`）
      - name: Configure with Meson
        run: |
          meson setup build . \
            --cross-file cross_file_arm64.txt \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers=panfrost \
            -Dplatforms=x11,wayland \
            -Dbuildtype=release

      # 5. 编译
      - name: Compile
        run: ninja -C build

      # 6. 上传生成的 .so 文件
      - name: Upload PanVK driver
        uses: actions/upload-artifact@v4
        with:
          name: panvk-driver-arm64
          path: build/src/vulkan/panfrost/libvulkan_panfrost.so
