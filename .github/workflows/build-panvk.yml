name: Build PanVK Driver (aarch64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-panvk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Mesa source (24.1.2)
        uses: actions/checkout@v4

      - name: Enable aarch64 foreign architecture
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update

      - name: Install native build tools
        run: |
          sudo apt-get install -y \
            meson \
            ninja-build \
            python3 \
            python3-pip \
            python3-mako \
            python3-yaml \
            pkg-config \
            glslang-tools \
            bison \
            flex \
            cmake \
            git

      - name: Install cross-compilation toolchain (aarch64)
        run: |
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libdrm-dev:arm64 \
            zlib1g-dev:arm64 \
            libexpat1-dev:arm64 \
            libx11-dev:arm64 \
            libxext-dev:arm64 \
            libxfixes-dev:arm64 \
            libxcb1-dev:arm64 \
            libxcb-glx0-dev:arm64 \
            libxcb-shm0-dev:arm64 \
            libx11-xcb-dev:arm64 \
            libxcb-dri2-0-dev:arm64 \
            libxcb-dri3-dev:arm64 \
            libxcb-present-dev:arm64 \
            libxshmfence-dev:arm64 \
            libxxf86vm-dev:arm64 \
            libxrandr-dev:arm64 \
            libwayland-dev:arm64 \
            libwayland-egl-backend-dev:arm64 \
            libelf-dev:arm64 \
            libvulkan-dev:arm64 \
            libclang-dev:arm64 \
            llvm-dev:arm64

      - name: Create Meson cross-compilation file
        run: |
          cat > /tmp/panvk-aarch64-cross.txt << 'EOF'
          [binaries]
          c = '/usr/bin/aarch64-linux-gnu-gcc'
          cpp = '/usr/bin/aarch64-linux-gnu-g++'
          ar = '/usr/bin/aarch64-linux-gnu-gcc-ar'
          strip = '/usr/bin/aarch64-linux-gnu-strip'
          pkg-config = '/usr/bin/aarch64-linux-gnu-pkg-config'
          llvm-config = '/usr/bin/aarch64-linux-gnu-llvm-config'

          [built-in options]
          c_args = []
          c_link_args = []
          cpp_args = []
          cpp_link_args = []

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      - name: Configure build with Meson (cross aarch64)
        run: |
          meson setup builddir/ \
            --cross-file /tmp/panvk-aarch64-cross.txt \
            --prefix="${PWD}/builddir/install" \
            -Dbuildtype=release \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers=[] \
            -Dtools=[] \
            -Dplatforms=x11,wayland \
            -Dvideo-codecs=[] \
            -Dtools=[]

      - name: Build PanVK
        run: |
          ninja -C builddir/ -j$(nproc)

      - name: Install to staging directory
        run: |
          ninja -C builddir/ install

      - name: Verify build output
        run: |
          echo "=== Verifying PanVK .so files ==="
          find builddir/install -name "*.so*" -type f | sort

          echo ""
          echo "=== Checking Vulkan ICD JSON ==="
          find builddir/install -name "*panfrost*.json" -type f | sort

          echo ""
          echo "=== Verifying architecture (should show aarch64) ==="
          SO_FILE=$(find builddir/install -name "libvulkan_panfrost.so" -type f | head -1)
          if [ -n "$SO_FILE" ]; then
            file "$SO_FILE"
          else
            echo "WARNING: libvulkan_panfrost.so not found, checking alternatives..."
            find builddir/install -name "*vulkan*panfrost*" -type f
            find builddir/install -name "*panfrost*" -type f
          fi

      - name: Upload PanVK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panvk-driver-aarch64
          path: builddir/install/
          retention-days: 14
          if-no-files-found: warn
