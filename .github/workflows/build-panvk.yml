name: Build PanVK Driver (aarch64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-panvk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Mesa source
        uses: actions/checkout@v4

      # ============================================================
      # 关键修复：arm64 包必须从 ports.ubuntu.com 获取
      # security.ubuntu.com / archive.ubuntu.com 不提供 arm64 索引
      # ============================================================
      - name: Configure apt for arm64 cross-compilation
        run: |
          sudo dpkg --add-architecture arm64

          # 仅针对 arm64 架构指向 ports.ubuntu.com
          sudo tee /etc/apt/sources.list.d/arm64-ports.list > /dev/null <<'SOURCES'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ noble-security main restricted universe multiverse
          SOURCES

          sudo apt-get update

      - name: Install native build tools (amd64)
        run: |
          sudo apt-get install -y \
            meson \
            ninja-build \
            python3 \
            python3-mako \
            python3-yaml \
            pkg-config \
            glslang-tools \
            bison \
            flex \
            cmake

      - name: Install cross-compilation toolchain + arm64 dev libraries
        run: |
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libdrm-dev:arm64 \
            libelf-dev:arm64 \
            zlib1g-dev:arm64 \
            libexpat1-dev:arm64 \
            libwayland-dev:arm64

      - name: Create Meson cross-compilation file
        run: |
          cat > /tmp/panvk-aarch64-cross.txt <<'EOF'
          [binaries]
          c = '/usr/bin/aarch64-linux-gnu-gcc'
          cpp = '/usr/bin/aarch64-linux-gnu-g++'
          ar = '/usr/bin/aarch64-linux-gnu-gcc-ar'
          strip = '/usr/bin/aarch64-linux-gnu-strip'
          pkg-config = '/usr/bin/aarch64-linux-gnu-pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      - name: Configure build with Meson (cross aarch64)
        run: |
          meson setup builddir/ \
            --cross-file /tmp/panvk-aarch64-cross.txt \
            --prefix="${PWD}/builddir/install" \
            -Dbuildtype=release \
            -Dvulkan-drivers=panfrost \
            -Dgallium-drivers=[] \
            -Dvulkan-layers=[] \
            -Dtools=[] \
            -Dplatforms=wayland \
            -Dvideo-codecs=[] \
            -Dosmesa=false

      - name: Build PanVK
        run: |
          ninja -C builddir/ -j$(nproc)

      - name: Install to staging directory
        run: |
          ninja -C builddir/ install

      - name: Verify build output
        run: |
          echo "=== .so files ==="
          find builddir/install -name "*.so*" -type f | sort
          echo ""
          echo "=== ICD JSON manifests ==="
          find builddir/install -name "*.json" -type f | sort
          echo ""
          echo "=== Architecture check ==="
          SO_FILE=$(find builddir/install -name "libvulkan_panfrost.so" -type f | head -1)
          if [ -n "$SO_FILE" ]; then
            file "$SO_FILE"
          else
            echo "libvulkan_panfrost.so not found, listing all panfrost files:"
            find builddir/install -name "*panfrost*" -type f
          fi

      - name: Upload PanVK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panvk-driver-aarch64
          path: builddir/install/
          retention-days: 14
          if-no-files-found: warn
