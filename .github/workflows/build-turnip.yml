name: Build Turnip Driver for Android (aarch64)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NDK_VERSION: r27b
  ANDROID_API: 28

jobs:
  build-turnip-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout Mesa source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep mesa -y
          sudo apt-get install -y \
            meson \
            ninja-build \
            python3 \
            python3-mako \
            python3-yaml \
            pkg-config \
            glslang-tools \
            bison \
            flex \
            wget \
            unzip \
            patchelf \
            zip \
            libssl-dev

      - name: Cache Android NDK
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux-v1

      - name: Download Android NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip \
            -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-${{ env.NDK_VERSION }} android-ndk-${{ env.NDK_VERSION }}-extracted 2>/dev/null || true
          if [ -d android-ndk-${{ env.NDK_VERSION }}-extracted ]; then
            mv android-ndk-${{ env.NDK_VERSION }}-extracted android-ndk-${{ env.NDK_VERSION }}
          fi
          rm -f ndk.zip

      - name: Set NDK environment variables
        run: |
          NDK_HOME="$PWD/android-ndk-${{ env.NDK_VERSION }}"
          TOOLCHAIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          echo "ANDROID_NDK=${NDK_HOME}" >> $GITHUB_ENV
          echo "ANDROID_TOOLCHAIN=${TOOLCHAIN}" >> $GITHUB_ENV
          echo "${TOOLCHAIN}/bin" >> $GITHUB_PATH

      - name: Create cross-compilation file
        run: |
          NDK="${{ env.ANDROID_TOOLCHAIN }}/bin"
          cat > /tmp/android-aarch64.txt <<EOF
          [binaries]
          ar = '${NDK}/llvm-ar'
          c = '${NDK}/aarch64-linux-android28-clang'
          cpp = '${NDK}/aarch64-linux-android28-clang++'
          c_ld = '${NDK}/ld.lld'
          cpp_ld = '${NDK}/ld.lld'
          strip = '${NDK}/llvm-strip'
          pkg-config = ['env', 'PKG_CONFIG_LIBDIR=${{ env.ANDROID_TOOLCHAIN }}/pkg-config', '/usr/bin/pkg-config']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF
          
      - name: Configure Mesa
        run: |
          meson setup builddir/ \
            --cross-file /tmp/android-aarch64.txt \
            --native-file /tmp/native.txt \
            --prefix="${PWD}/builddir/install" \
            --libdir=lib \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=${ANDROID_API} \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dvulkan-beta=true \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled \
            -Dvulkan-layers=[] \
            -Dtools=[] \
            -Dvideo-codecs=[] \
            -Dosmesa=false \
            -Dllvm=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dopengl=false \
            -Dlibunwind=disabled \
            -Dvalgrind=disabled \
            -Dstrip=true

      - name: Build Mesa turnip
        run: ninja -C builddir/ -j$(nproc)

      - name: Install to staging directory
        run: ninja -C builddir/ install

      - name: Prepare driver with correct soname
        run: |
          mkdir -p "${PWD}/output"

          # turnip for magisk / general Android use
          cp builddir/src/freedreno/vulkan/libvulkan_freedreno.so \
            "${PWD}/output/vulkan.turnip.so"
          patchelf --set-soname vulkan.turnip.so \
            "${PWD}/output/vulkan.turnip.so"

          # turnip for adrenotools
          cp builddir/src/freedreno/vulkan/libvulkan_freedreno.so \
            "${PWD}/output/vulkan.freedreno.so"
          patchelf --set-soname vulkan.freedreno.so \
            "${PWD}/output/vulkan.freedreno.so"

          echo "=== Output files ==="
          file "${PWD}/output/"*.so
          readelf -h "${PWD}/output/vulkan.turnip.so" | grep -E "Class|Machine|OS/ABI"
          readelf -d "${PWD}/output/vulkan.turnip.so" | grep NEEDED
          readelf -d "${PWD}/output/vulkan.turnip.so" | grep SONAME

      - name: Upload turnip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: turnip-android-aarch64
          path: output/
          retention-days: 14
          if-no-files-found: warn